# Policy della catena delle dipendenze (cargo-deny), sul modello di
# plenora-database-tools: advisory rifiutate senza eccezioni, licenze
# permissive in allowlist, solo sorgenti crates.io o patch locali in vendor/.
# Il workflow supply-chain la applica al grafo del workspace e a quello
# separato di fuzz/.

# ============================================================================
#  advisories
# ============================================================================

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
ignore = []

# ============================================================================
#  licenses
# ============================================================================

[licenses]
version = 2
# Licenze permissive largamente compatibili con distribuzione binaria.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.8
exceptions = [
    # `libfuzzer-sys` incorpora LLVM libFuzzer sotto NCSA: licenza
    # permissiva con obblighi di attribuzione, limitata al crate del lock
    # separato di `fuzz/` invece di ampliare la allowlist generale. Sul
    # grafo del workspace l'eccezione non si incontra (avviso atteso).
    { allow = ["MIT", "Apache-2.0", "NCSA"], crate = "libfuzzer-sys" },
]

# I crate del workspace sono nostri, con `publish = false`, e non sono
# dipendenze di terze parti. L'esclusione non tocca la allowlist: le licenze
# di ogni dipendenza esterna restano verificate.
[licenses.private]
ignore = true

# ============================================================================
#  bans (duplicati e crate proibiti)
# ============================================================================

[bans]
multiple-versions = "warn"
# Le dipendenze fra crate del workspace (`foo.workspace = true`, path)
# appaiono come wildcard: la versione la governa il manifesto radice. Le
# wildcard verso dipendenze esterne restano rifiutate.
wildcards = "deny"
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

# ============================================================================
#  sources (origini dei crate accettate)
# ============================================================================

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
