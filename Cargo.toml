[workspace]
resolver = "2"
members = [
    "crates/plenora-core",
    "crates/plenora-kernels-table",
    "crates/plenora-kernels-geo",
    "crates/plenora-engine",
    "crates/plenora-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false

# Unico punto di versione delle dipendenze (decisione D0, Architetture.md §2).
[workspace.dependencies]
# Arrow =59.1.0 — versione comune dei due progetti di origine.
arrow-array = "=59.1.0"
arrow-schema = "=59.1.0"
arrow-ipc = "=59.1.0"
arrow-select = "=59.1.0"
# Geometrie
geo = "=0.33.1"
geozero = { version = "=0.15.1", default-features = false, features = ["with-geo", "with-wkb"] }
wkt = "=0.14.0"
rayon = "=1.12.0"
rstar = "=0.12.2"
# Backend opzionali
geos = { version = "=11.1.1", features = ["static", "v3_14_0"] }
proj = { version = "=0.31.0", features = ["bundled_proj"] }
# Comuni
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"
chrono = { version = "=0.4.42", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"
regex = "=1.12.2"
unicode-normalization = "=0.1.25"
num-traits = "=0.2.19"
md-5 = "=0.10.6"
sha2 = "=0.10.9"
uuid = { version = "=1.18.1", features = ["v4"] }
tempfile = "=3.27.0"
# Handler Ctrl-C della CLI (ADR 3, M1c): setta il token di cancellazione
# cooperativa. Piccola, mantenuta, nessun unsafe nel perimetro del workspace
# (unsafe_code e' proibito solo nei crate del workspace).
ctrlc = "=3.5.2"
# statfs per il riconoscimento fail-closed del filesystem (ADR 7, solo
# Linux) e kill(pid, 0) per lo scavenging dei temp store (ADR 3, feature
# "process"): stessa versione gia' presente nel lockfile come dipendenza di
# tempfile; API safe (unsafe_code e' proibito nel workspace).
rustix = { version = "=1.1.4", default-features = false, features = ["std", "fs", "process"] }
# Dev
proptest = "=1.10.0"

# Crate interni
plenora-core = { path = "crates/plenora-core" }
plenora-kernels-table = { path = "crates/plenora-kernels-table" }
plenora-kernels-geo = { path = "crates/plenora-kernels-geo" }
plenora-engine = { path = "crates/plenora-engine" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Politica lint: si nega solo cio' che la CI applica davvero. Dopo la
# pulizia profonda 2026-07-28 (863 -> 0 warning) tutti i gruppi sono
# deny; ogni deviazione voluta resta possibile solo come `#[allow]`
# mirato e motivato nel codice. Il gate anti-panic R6 resta un passo CI
# dedicato con lint espliciti (piu' stretto di questa tabella).
[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
