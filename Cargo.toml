[workspace]
resolver = "2"
members = [
    "crates/plenora-core",
    "crates/plenora-kernels-table",
    "crates/plenora-kernels-geo",
    "crates/plenora-pipeline",
    "crates/plenora-io",
    "crates/plenora-cli",
    "crates/plenora-data-py",
]
# Sorgenti vendorizzate per [patch.crates-io] (vedi sotto): raggiunte solo da
# [patch], mai membri del workspace.
exclude = ["vendor"]

[workspace.package]
version = "1.1.0"
edition = "2021"
rust-version = "1.98"
publish = false

# Unico punto di versione delle dipendenze. Pin esatti, identici a
# plenora-data-tools@190c493 per le dipendenze che i kernel usano, tranne
# Arrow (60.0.0 qui, 59.2.0 li'); i backend nativi (geos, proj) e le
# dipendenze di engine/CLI/isolamento non ci sono.
[workspace.dependencies]
# Arrow =60.0.0 (59.2.0 in plenora-data-tools@190c493). Rispetto alla 59.2.0
# il lockfile ha un crate in più, `arrow-cmp` 60.0.0
# (comparatori per posizione, dipendenza non opzionale di `arrow-select` 60,
# che lo usa in `take` sulle run-end; dipende solo da arrow-array,
# arrow-buffer e arrow-schema), e nessuno in meno. I metadati di schema e di
# campo sono `arrow_schema::Metadata` (una `BTreeMap`: iterazione in
# ordine di chiave), non `HashMap<String, String>`.
arrow-array = "=60.0.0"
# Tipi di schema e campo di Arrow, riesportati da plenora-core.
arrow-schema = "=60.0.0"
# Formato IPC di Arrow (file e stream), riesportato da plenora-core.
arrow-ipc = "=60.0.0"
# Kernel di selezione di Arrow (`take`, `filter`, `concat`), riesportati da plenora-core.
arrow-select = "=60.0.0"
# `ArrayData` per visitare i nodi di una colonna (lunghezze dei figli) nella
# stima del picco di un'unione di blocchi (`plenora_core::memoria`). Non e'
# una dipendenza nuova: arrow-array la usa gia', stessa release, nessun
# pacchetto nuovo nel lockfile.
arrow-data = "=60.0.0"
# `Buffer` di Arrow per plenora-io: la lettura IPC legge il file intero in un
# buffer allineato e lo decodifica con `FileDecoder`/`StreamDecoder` di
# arrow-ipc sugli stessi byte che il confine ha verificato (docs/file.md, «Confine
# di lettura»). Non e' una dipendenza nuova: arrow-array e arrow-ipc la usano
# gia', nel lockfile nessun pacchetto nuovo.
arrow-buffer = "=60.0.0"
# Lettura e scrittura Parquet/GeoParquet di plenora-io (i formati di file
# sono Arrow IPC e Parquet). Stessa
# release arrow-rs dei crate Arrow sopra (60.0.0), cosi' i tipi Arrow
# sono gli stessi e il lockfile non porta una seconda copia di Arrow.
# Feature minime, ognuna voluta:
# - `arrow`: lettore/scrittore `RecordBatch` e schema Arrow incorporato
#   (`ARROW:schema`); l'unica API che plenora-io usa;
# - `snap`: codec SNAPPY (crate `snap`, Rust puro), il default di pyarrow,
#   GDAL e DuckDB: senza, la maggior parte dei file reali non si legge;
# - `zstd`: codec ZSTD (crate `zstd` -> `zstd-sys`, libzstd in C compilata
#   con `cc`, senza cmake: basta il compilatore C che il linker del target
#   gia' richiede). Non esiste un codec ZSTD Rust puro nel crate `parquet`;
#   senza, i file ZSTD (comuni nei dati GeoParquet pubblicati) si rifiutano.
# - `crc`: verifica dei checksum di pagina: una pagina corrotta ma ancora
#   decodificabile che porta il
#   suo CRC diventa un errore esplicito invece di valori sbagliati in
#   silenzio. Porta `crc32fast` (pin sotto).
# Escluse di proposito: `lz4`, `flate2` (GZIP), `brotli` (codec rari nei dati
# geografici: un file che li usa fallisce con un errore esplicito del
# codec), `async`, `object_store`, `json`, `variant_*`, `simdutf8`,
# `experimental`, `encryption`.
# Crate nuovi nel lockfile (10): parquet, snap, zstd, zstd-safe, zstd-sys,
# jobserver e pkg-config (build di zstd-sys), seq-macro, twox-hash (non
# opzionali di parquet), base64; il resto (arrow-*, cc, bytes, half,
# hashbrown, num-*, chrono, flatbuffers) c'era gia'. Con `parquet` 60.0.0
# `zstd` passa a 0.14.0 e `zstd-safe` a 8.0.0 (richiesti da `parquet`),
# `zstd-sys` resta 2.1.0 (stessa libzstd 1.5.7).
# Il sorgente e' vendorizzato con una patch (`[patch.crates-io]` sotto,
# `vendor/parquet-60.0.0-eof/PROVENANCE.md`): il protocollo thrift della
# 60.0.0 gira a vuoto su un header di pagina malformato.
parquet = { version = "=60.0.0", default-features = false, features = ["arrow", "snap", "zstd", "crc"] }
# CRC32 dei checksum di pagina Parquet (feature `crc` sopra): l'unico crate
# nuovo nel lockfile per quella feature (la sua dipendenza `cfg-if` c'era
# gia'). Versione esatta, la piu' recente compatibile con `^1.4.2` di
# `parquet` (richiesta invariata in 60.0.0), senza feature come la chiede
# `parquet`; plenora-io la dichiara solo per fissarne la versione.
crc32fast = { version = "=1.5.2", default-features = false }
# Decodifica dello schema Arrow incorporato nei file Parquet (`ARROW:schema`,
# base64 standard): plenora-io lo confronta con lo schema che `parquet`
# applica davvero, perche' `parquet` ricade in silenzio sul tipo Parquet
# quando il tipo incorporato non e' applicabile. E' la stessa copia che
# `parquet` usa (0.23.1, feature `std`).
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
# Geometrie
geo = "=0.33.1"
# Codifica e decodifica WKB delle geometrie `geo` in plenora-kernels-geo.
geozero = { version = "=0.15.1", default-features = false, features = ["with-geo", "with-wkb"] }
# Lettura e scrittura WKT (`geo.from_wkt`, `geo.to_wkt`); vendorizzato con patch (sotto).
wkt = "=0.14.0"
# Parallelismo dati nei kernel (raccolta posizionale: uscita identica al sequenziale).
rayon = "=1.12.0"
# R-tree degli indici spaziali di plenora-kernels-geo (join, cluster, vicini).
rstar = "=0.12.2"
# Triangolazione di Delaunay di `geo.delaunay` e `geo.voronoi` con il
# caricamento in blocco (`bulk_load`): `geo` 0.33.1 inserisce i punti uno
# alla volta (100k punti in ~0,65 s, 1M in ~83 s). Non e' una dipendenza
# nuova: e' la stessa copia che `geo` usa gia' (feature `spade`; nel lockfile
# nessun pacchetto nuovo), con i predicati esatti di `robust` 1.2.0. Scelta
# di `bulk_load` e limiti in docs/limiti.md, «geo.delaunay e geo.voronoi».
spade = "=2.15.1"
# Misure geodetiche di plenora-kernels-geo (`geodetica`) sull'ellissoide del
# datum del CRS: `Geodesic`, `Bearing` e `GeodesicArea` di `geo` usano solo
# WGS 84 (`Geodesic::wgs84()` fisso), e per ED50, Monte Mario, NAD27, OSGB36
# l'errore e' di metri. Non e' una dipendenza nuova: e' la stessa copia che
# `geo` usa gia' (0.2.7, stesse feature: `default-features = false`, senza
# `accurate`), nessun pacchetto nuovo nel lockfile.
geographiclib-rs = { version = "=0.2.7", default-features = false }
# Dev-dependency di plenora-kernels-geo (probe privacy sul logging di
# `relate`): transitiva di `geo`/`geozero`, pinnata perche' il test la usa
# direttamente.
log = "=0.4.33"
# Comuni
# Deserializzazione dei piani, delle config e dei contratti.
serde = { version = "=1.0.229", features = ["derive"] }
# JSON di piani, config, metadati e inviluppi; `raw_value` per il piano grezzo della CLI.
serde_json = { version = "=1.0.151", features = ["raw_value"] }
# Derivazione di `Error` per gli errori pubblici di plenora-core e plenora-kernels-geo.
thiserror = "=2.0.21"
# Date e orari delle operazioni tabellari e della scadenza della CLI (RFC 3339).
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
# Database dei fusi IANA di `table.timezone_convert` e delle date con fuso.
chrono-tz = "=0.10.4"
# Espressioni regolari delle operazioni su stringhe, qualita' e pulizia.
regex = "=1.13.1"
# Normalizzazione Unicode (NFC/NFD, segni combinanti) delle operazioni su stringhe.
unicode-normalization = "=0.1.25"
# Tratti numerici generici delle aggregazioni e delle finestre tabellari.
num-traits = "=0.2.19"
# Digest di `table.md5_hash`.
md-5 = "=0.11.0"
# SHA-256 di `table.sha256_hash` e `table.hmac_sha256`, e delle attese sugli artefatti della CLI.
sha2 = "=0.11.0"
# UUID v4 di `table.uuid_generator`.
uuid = { version = "=1.26.1", features = ["v4"] }
# File temporanei della scrittura atomica (plenora-io) e degli artefatti della CLI.
tempfile = "=3.27.0"
# Annullamento della CLI `plenora-data` (crates/plenora-cli): Ctrl-C
# (SIGINT, CTRL_C_EVENT) e, con la feature `termination`, SIGTERM e
# CTRL_CLOSE/CTRL_BREAK diventano un segnale cooperativo che il runner legge
# fra i passi, e l'invocazione finisce con l'inviluppo `cancelled` ed exit
# 130 (CLI 2.0, sezione 9) invece di morire senza documento su stdout. La
# libreria standard non ha un'API per i segnali, e scriverla qui vorrebbe
# FFI (`unsafe`, vietato nel workspace): `ctrlc` contiene quell'`unsafe`, in
# un crate piccolo e diffuso. Pacchetti nuovi nel lockfile (7): `ctrlc`
# 3.5.2; per Unix `nix` 0.31.3 con `cfg_aliases` 0.2.2 (build); per Apple
# `dispatch2` 0.3.1, `block2` 0.6.2, `objc2` 0.6.4, `objc2-encode` 4.1.0
# (target non compilati qui, ma nel lockfile). Su Windows usa il
# `windows-sys` 0.61.2 gia' nel lockfile; `libc` e `bitflags` c'erano gia'.
ctrlc = { version = "=3.5.2", features = ["termination"] }
# SDK Python `plenora-data` (crates/plenora-data-py): il modulo nativo
# `plenora_data._native`. Python SDK 1.0 di plenora-contracts vuole un
# pacchetto Python con PEP 561, eccezioni tipizzate e tabelle PyArrow al
# confine; chiamare il runner da Python senza un binding vorrebbe FFI
# scritta qui (`unsafe`, vietato nel workspace) o un sottoprocesso della CLI
# (una copia delle tabelle per ogni passaggio, niente Arrow in memoria).
# `pyo3` 0.29.2 e' la versione di plenora-database-tools (stesso binding,
# stessa ABI stabile `abi3-py310`: un wheel per piattaforma per Python
# >= 3.10). Senza `extension-module` qui: la build di maturin la aggiunge
# (pyproject.toml), cosi' `cargo test --workspace` collega libpython invece
# di lasciare simboli indefiniti. `unsafe` sta dentro `pyo3` e nelle sue
# espansioni (macro esterne, che il lint `unsafe_code` del workspace non
# esamina), mai nel codice del crate: README del crate, «unsafe e macro
# PyO3». Pacchetti nuovi nel lockfile con `arrow-pyarrow` (9): `pyo3`,
# `pyo3-ffi`, `pyo3-macros`, `pyo3-macros-backend`, `pyo3-build-config`
# 0.29.2, `heck` 0.5.0 (nomi delle macro), `target-lexicon` 0.13.5 (build),
# `portable-atomic` 1.15.0, `arrow-pyarrow` 60.0.0; ognuno in una sola
# versione, nessuno gia' presente in un'altra.
pyo3 ={ version = "=0.29.2", default-features = false, features = ["macros", "abi3-py310"] }
# Scambio delle tabelle con PyArrow per l'Arrow C Data/Stream Interface
# (PyCapsule `__arrow_c_stream__`): le tabelle passano senza copia nei due
# versi. E' il crate di arrow-rs per pyarrow, alla stessa release 60.0.0
# dei crate Arrow sopra (stessi tipi, nessuna seconda copia di Arrow), e
# chiede `pyo3` `^0.29.0`, compatibile con il pin sopra. Attiva la feature
# `ffi` di `arrow-array` (l'`unsafe` della C Data Interface sta li').
arrow-pyarrow = "=60.0.0"
# Dev
proptest = "=1.11.0"

# Crate interni
plenora-core = { path = "crates/plenora-core" }
plenora-kernels-table = { path = "crates/plenora-kernels-table" }
plenora-kernels-geo = { path = "crates/plenora-kernels-geo" }
plenora-pipeline = { path = "crates/plenora-pipeline" }
plenora-io = { path = "crates/plenora-io" }
plenora-cli = { path = "crates/plenora-cli" }

[workspace.lints.rust]
unsafe_code = "forbid"
# Un refuso di `cfg` non rompe la build: spegne silenziosamente il codice.
unexpected_cfgs = "deny"

# Tutti i gruppi sono deny e il codebase passa con zero warning; ogni
# deviazione voluta e' un `#[allow]` mirato e motivato nel codice. Il gate
# anti-panic resta un passo dedicato con lint espliciti (vedi AGENTS.md).
[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
# Overflow aritmetico = panico dichiarato anche in release, mai un valore
# avvolto in silenzio.
overflow-checks = true

# Copie vendorizzate (provenienza: vendor/*/PROVENANCE.md, patch in patches/).
[patch.crates-io]
#
# `i_overlay` (transitiva, via `geo`) e' pinnata esatta a `=9.0.0` nel
# manifesto del `geo` vendorizzato (`patches/geo-i-overlay-9.patch`), al posto
# di 4.5.2. Motivazione: 4.5 perde senza errore regioni piene oltre circa
# 16.000 segmenti (solver `Frag` scelto da `Auto`, upstream #87), sbaglia
# l'estrazione OGC (buchi legati alla faccia sbagliata, panici: #78-#81,
# #91-#92) e con interi `i32` limita la griglia a estensioni di circa 2.950
# km a 1 cm; 9.0.0 corregge i difetti e offre il motore `i64` (passo
# `2^(ceil(log2 r) - 61)`), che `geo` usa per tutte le chiamate. Nel lockfile
# con lei: `i_float` 5.0.0, `i_shape` 5.0.0, `i_tree` 0.19.0, `i_key_sort`
# 0.11.0, nessuna versione 4.x/1.x. `i_overlay` e le sue dipendenze
# contengono `unsafe` proprio (non nostro: `unsafe_code = "forbid"` vale per
# i crate del workspace).
# La patch di `i_shape` 1.18.0 (area zero su un percorso vuoto) e' caduta:
# `i_shape` 5 non ha piu' la funzione, e l'offset di `i_overlay` 9 salta i
# percorsi con meno di tre punti prima di calcolarne l'area (vendor/
# geo-0.33.1-exact-filtered/PROVENANCE.md).
geo = { path = "vendor/geo-0.33.1-exact-filtered" } # orientamento esatto + logging + filtro veloce + i_overlay 9 (PROVENANCE*.md)
wkt = { path = "vendor/wkt-0.14.0-v2" }          # wkt-v2.patch (componenti vuoti, InteriorWithoutExterior, try_wkt_string)
parquet = { path = "vendor/parquet-60.0.0-eof" }   # parquet-eof.patch: il protocollo thrift segnala la fine dei dati invece di girare a vuoto (PROVENANCE.md)
