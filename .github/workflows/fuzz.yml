name: fuzz

# Campagne dei target di fuzz (`fuzz/`): un job per target, su Linux, con i
# corpus iniziali di scripts/genera_corpus_fuzz.py. Gira ogni domenica e a
# mano per 10 minuti a target; sulle PR che toccano i target o i corpus, un
# minuto a target (le altre PR li compilano soltanto, in ci.yml). Un crash, un
# timeout o un'uscita non nulla fanno fallire il job e i reperti restano come
# artefatto della run.
#
# `lettura_parquet` gira con -fork=1 -ignore_ooms=1 -malloc_limit_mb=1024: le
# allocazioni guidate dal file dentro `parquet` sono un limite dichiarato
# (docs/file.md) e un caso di sola memoria si conta senza fermare la
# campagna, che resta sui blocchi e sui risultati sbagliati.

on:
  pull_request:
    branches: [main]
    paths:
      - 'fuzz/**'
      - 'scripts/genera_corpus_fuzz.py'
      - '.github/workflows/fuzz.yml'
  schedule:
    # Domenica 03:41 UTC. Minuto non tondo, come supply-chain.yml.
    - cron: '41 3 * * 0'
  workflow_dispatch:
    inputs:
      secondi:
        description: secondi per target
        required: false
        default: '600'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NIGHTLY: nightly-2026-07-21

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - piano
          - esecuzione_tabellare
          - ordinamento
          - ordinamento_parallelo
          - esecuzione_geo
          - wkb
          - lettura_ipc
          - lettura_parquet
          - argomenti_cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: corpus iniziali
        run: |
          python -m pip install -r requirements-sdk-tests.txt
          python scripts/genera_corpus_fuzz.py fuzz/corpus
      - name: Rust nightly
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.98.1
        with:
          toolchain: ${{ env.NIGHTLY }}
      - name: cargo-fuzz 0.13.2
        run: cargo +"$NIGHTLY" install cargo-fuzz --version 0.13.2 --locked
      - name: campagna
        env:
          TARGET: ${{ matrix.target }}
          SECONDI: ${{ github.event_name == 'pull_request' && '60' || github.event.inputs.secondi || '600' }}
        run: |
          extra=""
          if [ "$TARGET" = lettura_parquet ]; then
            extra="-fork=1 -ignore_ooms=1 -malloc_limit_mb=1024"
          fi
          mkdir -p "fuzz/artifacts/$TARGET"
          cargo +"$NIGHTLY" fuzz run "$TARGET" --fuzz-dir fuzz "fuzz/corpus/$TARGET" -- \
            -max_total_time="$SECONDI" -rss_limit_mb=2048 -timeout=30 \
            -artifact_prefix="fuzz/artifacts/$TARGET/" -print_final_stats=1 $extra
      - name: reperti
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30
