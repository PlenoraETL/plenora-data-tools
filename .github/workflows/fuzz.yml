# Campagna fuzz in CI (Linux nativo).
#
# Motivazione: su Windows/Docker Desktop la campagna locale subisce hang
# kernel WSL2 ripetuti (deadlock in __vma_start_write, per-vma-lock del
# kernel 6.18, riproducibile con qualunque configurazione di I/O: bind
# mount 9p, volume ext4, tmpfs). Evidenze in fuzz/campaign-logs/hang-dmesg-*.log.
# Su runner Linux nativo libFuzzer non ha questi problemi e gira 2-5x piu'
# veloce.
#
# Ogni target e' un job della matrice (runner separato, fail-fast disattivo).
# Il corpus e' persistito via actions/cache per target e riusato tra i run;
# i crash artifact sono caricati come workflow artifact e fanno fallire il job.
name: fuzz

on:
  workflow_dispatch:
    inputs:
      minutes_per_target:
        description: 'Minuti di fuzzing per target'
        default: '30'
        required: false
  schedule:
    # ogni notte alle 03:17 UTC
    - cron: '17 3 * * *'

concurrency:
  group: fuzz-campaign
  cancel-in-progress: false

# Permessi minimi ed espliciti: la campagna legge il repository e carica
# artefatti, non scrive nulla tramite `GITHUB_TOKEN`.
permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - plan_contract
          - string_chain
          - candidate_chain
          - binary_ops
          - reshape_policies
          - extended_ops
          - advanced_ops
          - wkb_contract
          - wkt_operations
          - arrow_envelope
          - arrow_ipc_decode
          # arrow_transform e' in quarantena dal 2026-08-07. NON e' un difetto
          # non corretto: la barriera esiste ed e' verificata dal test
          # `ipc_decode_converte_il_panico_di_arrow_in_errore`, che asserisce
          # `ArrowTransportError::ArrowPanic` sullo stesso payload.
          #
          # Il target non puo' osservarla. `libfuzzer-sys` installa un hook di
          # panico che chiama `std::process::abort()` prima che l'unwinding
          # cominci (0.4.10, src/lib.rs:92-95), deliberatamente, perche' un
          # `catch_unwind` nel codice sotto test nasconderebbe i difetti al
          # fuzzer. Il target resterebbe quindi rosso a barriera funzionante, e
          # un job perennemente rosso smette di essere letto: e' cosi' che il
          # disallineamento della matrice SQL Server e' sopravvissuto tre
          # giorni e il panico WKT undici.
          #
          # Va riattivato quando arrow-rs rende fallibile la conversione dello
          # schema, cioe' quando la barriera non servira' piu'. Segnalato a
          # monte: apache/arrow-rs#10575.
          # - arrow_transform
          # Rinominato da `plan_v4_parse` il 2026-08-20 con la v5
          # (errori-e-limiti.md#memoria-governata): il target parsa il formato canonico, e un nome
          # che cita la versione sbagliata manda a cercare nel posto
          # sbagliato. Il corpus non e' versionato (.gitignore) e
          # riparte da zero sotto il nome nuovo.
          - plan_v5_parse
          - analyze_table
          - analyze_geo
          - diff_kernels
          - executor_dag
    env:
      MINUTES: ${{ github.event.inputs.minutes_per_target || '30' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Toolchain nightly DATATA e action pinnata a SHA: `@nightly` era un
      # ramo mobile su un canale mobile, quindi due esecuzioni della stessa
      # campagna potevano usare compilatore e codice di action diversi e un
      # crash poteva sparire senza che nulla fosse cambiato nel progetto.
      # La data si alza deliberatamente, con la stessa disciplina degli altri
      # pin del progetto.
      - name: Installa toolchain nightly (datata)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-23
        with:
          toolchain: nightly-2026-08-01

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: cargo-fuzz-build-${{ matrix.target }}-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: cargo-fuzz-build-${{ matrix.target }}-

      - name: Cache corpus (${{ matrix.target }})
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Installa cargo-fuzz (pin 0.13.2)
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Fuzz ${{ matrix.target }} (${{ env.MINUTES }} min)
        working-directory: fuzz
        # RUSTUP_TOOLCHAIN vince su rust-toolchain.toml (stabile 1.98, R13):
        # senza questa variabile cargo-fuzz usa la toolchain pinnata di
        # progetto e `-Zsanitizer` fallisce ("only accepted on nightly").
        # Limite dichiarato: docs/release.md, sezione «Fuzzing».
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-08-01
        run: |
          set -euo pipefail
          # `MINUTES` arriva da workflow_dispatch: e' input esterno e va
          # validato prima di finire in un'espressione aritmetica. Solo cifre
          # decimali, niente zeri iniziali (in bash `08` e' ottale e fa
          # fallire il calcolo), e un intervallo dichiarato.
          case "$MINUTES" in
            0|*[!0-9]*|0[0-9]*) echo "minutes_per_target non numerico: rifiutato" >&2; exit 2 ;;
          esac
          # La LUNGHEZZA prima del valore. `[ ... -gt ... ]` non gestisce
          # interi arbitrariamente grandi: con un input di venti cifre stampa
          # "integer expression expected" e ritorna 2, e dentro un `if` quel
          # ritorno non fa scattare `set -e` — il confronto veniva quindi
          # saltato, l'aritmetica riduceva il valore e una campagna con un
          # input dichiaratamente fuori dominio partiva lo stesso.
          if [ "${#MINUTES}" -gt 3 ]; then
            echo "minutes_per_target oltre il massimo di 720" >&2
            exit 2
          fi
          if [ "$MINUTES" -gt 720 ]; then
            echo "minutes_per_target oltre il massimo di 720" >&2
            exit 2
          fi
          # NON usare `SECONDS`: e' una variabile speciale di bash che conta
          # i secondi dall'avvio della shell, quindi assegnarla e rileggerla
          # restituisce un valore che nel frattempo e' cambiato.
          durata=$(( MINUTES * 60 ))
          cargo fuzz run "${{ matrix.target }}" -- \
            -max_total_time="$durata" \
            -artifact_prefix="artifacts/${{ matrix.target }}/" \
            -timeout=60 -rss_limit_mb=8192

      - name: Carica crash artifact (se presenti)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crash-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
