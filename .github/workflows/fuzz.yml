# Campagna fuzz in CI (Linux nativo).
#
# Motivazione: su Windows/Docker Desktop la campagna locale subisce hang
# kernel WSL2 ripetuti (deadlock in __vma_start_write, per-vma-lock del
# kernel 6.18, riproducibile con qualunque configurazione di I/O: bind
# mount 9p, volume ext4, tmpfs). Evidenze in fuzz/campaign-logs/hang-dmesg-*.log.
# Su runner Linux nativo libFuzzer non ha questi problemi e gira 2-5x piu'
# veloce.
#
# Ogni target e' un job della matrice (runner separato, fail-fast disattivo).
# Il corpus e' persistito via actions/cache per target e riusato tra i run;
# i crash artifact sono caricati come workflow artifact e fanno fallire il job.
name: fuzz

on:
  workflow_dispatch:
    inputs:
      minutes_per_target:
        description: 'Minuti di fuzzing per target'
        default: '30'
        required: false
  schedule:
    # ogni notte alle 03:17 UTC
    - cron: '17 3 * * *'

concurrency:
  group: fuzz-campaign
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - plan_contract
          - string_chain
          - candidate_chain
          - binary_ops
          - reshape_policies
          - extended_ops
          - advanced_ops
          - wkb_contract
          - wkt_operations
          - arrow_envelope
          - arrow_ipc_decode
          # arrow_transform e' in quarantena dal 2026-08-07. NON e' un difetto
          # non corretto: la barriera esiste ed e' verificata dal test
          # `ipc_decode_converte_il_panico_di_arrow_in_errore`, che asserisce
          # `ArrowTransportError::ArrowPanic` sullo stesso payload.
          #
          # Il target non puo' osservarla. `libfuzzer-sys` installa un hook di
          # panico che chiama `std::process::abort()` prima che l'unwinding
          # cominci (0.4.10, src/lib.rs:92-95), deliberatamente, perche' un
          # `catch_unwind` nel codice sotto test nasconderebbe i difetti al
          # fuzzer. Il target resterebbe quindi rosso a barriera funzionante, e
          # un job perennemente rosso smette di essere letto: e' cosi' che il
          # disallineamento della matrice SQL Server e' sopravvissuto tre
          # giorni e il panico WKT undici.
          #
          # Va riattivato quando arrow-rs rende fallibile la conversione dello
          # schema, cioe' quando la barriera non servira' piu'. Segnalato a
          # monte: apache/arrow-rs#10575.
          # - arrow_transform
          # Rinominato da `plan_v4_parse` il 2026-08-20 con la v5
          # (errori-e-limiti.md#memoria-governata): il target parsa il formato canonico, e un nome
          # che cita la versione sbagliata manda a cercare nel posto
          # sbagliato. Il corpus non e' versionato (.gitignore) e
          # riparte da zero sotto il nome nuovo.
          - plan_v5_parse
          - analyze_table
          - analyze_geo
          - diff_kernels
          - executor_dag
    env:
      MINUTES: ${{ github.event.inputs.minutes_per_target || '30' }}
    steps:
      - uses: actions/checkout@v4

      - name: Installa toolchain nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: cargo-fuzz-build-${{ matrix.target }}-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: cargo-fuzz-build-${{ matrix.target }}-

      - name: Cache corpus (${{ matrix.target }})
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Installa cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz ${{ matrix.target }} (${{ env.MINUTES }} min)
        working-directory: fuzz
        # RUSTUP_TOOLCHAIN vince su rust-toolchain.toml (stabile 1.92, R13):
        # senza questa variabile cargo-fuzz usa la toolchain pinnata di
        # progetto e `-Zsanitizer` fallisce ("only accepted on nightly").
        # Limite dichiarato: docs/release.md, sezione «Fuzzing».
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          SECONDS=$(( MINUTES * 60 ))
          cargo fuzz run "${{ matrix.target }}" -- \
            -max_total_time="$SECONDS" \
            -artifact_prefix="artifacts/${{ matrix.target }}/" \
            -timeout=60 -rss_limit_mb=8192

      - name: Carica crash artifact (se presenti)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
