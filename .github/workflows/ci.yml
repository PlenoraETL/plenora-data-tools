# CI base: build e test su ogni push/PR.
#
# Fino al 2026-07-27 il progetto non aveva CI di test: un test rosso
# (conteggio catalogo) e' sopravvissuto per giorni su main. Questo
# workflow e' il minimo sindacale per impedirlo di nuovo.
#
# Matrice Linux/Windows: il publish atomico (ADR-0007) ha rami per
# piattaforma (cfg) che un test solo-Linux non eserciterebbe.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify candidate revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Installa toolchain (baseline ICD R13.1)
        # Versione esatta fissata anche in rust-toolchain.toml per lo
        # sviluppo locale; qui la ripetiamo esplicitamente perche' la CI
        # non deve dipendere dal canale "stable" mobile.
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # La chiave include la toolchain: artefatti compilati da versioni
          # diverse del compilatore non sono riusabili (ld bus error su
          # restore incrociato, osservato 2026-07-27).
          key: cargo-ci-1.92.0-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ci-1.92.0-${{ matrix.os }}-

      # R13.2: --locked. Un Cargo.lock modificato dalla build e' un
      # fallimento, non un aggiornamento.
      - name: Test workspace
        run: cargo test --workspace --locked --no-fail-fast

      # Gate R6 (ICD): nel codice di produzione nessuna primitiva di panic e
      # nessun unsafe. Bloccante. MAI aggiungere --cap-lints=warn: cappera'
      # anche i -D espliciti declassandoli a warn (regressione trovata il
      # 2026-07-29 — il gate non bloccava nulla, 27 siti accumulati). I
      # lint di stile sono gia' deny da workspace.lints con zero warning,
      # non serve alcun cap.
      #
      # Perimetro esteso il 2026-08-06 a plenora-cli con --bins: la CLI e'
      # codice di produzione a tutti gli effetti (e' l'unico eseguibile
      # distribuito) ma non ha target --lib, quindi restava fuori dal gate.
      # L'estensione ha scoperto 3 expect() nel binario (hex_digest,
      # graph_summary_json x2), corretti alla fonte. `--lib --bins` copre
      # entrambe le forme senza allargare il gate ai target di test, dove le
      # primitive di panic restano legittime.
      - name: Gate anti-panic (R6)
        run: >
          cargo clippy -p plenora-core -p plenora-engine
          -p plenora-kernels-table -p plenora-kernels-geo -p plenora-cli
          --lib --bins --locked --
          -D unsafe-code
          -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
          -D clippy::unreachable -D clippy::todo -D clippy::unimplemented

      # Clippy bloccante (dopo la passata di pulizia 2026-07-27 e il
      # rialzo a deny di pedantic/nursery): tutti i gruppi lint sono deny
      # da workspace.lints e il codebase passa con zero warning. Da qui in
      # poi il debito lint non puo' piu' accumularsi.
      - name: Clippy (gate)
        run: cargo clippy --workspace --all-targets --locked

  # Backend nativi (GEOS static, PROJ bundled): i rami feature-gated di
  # reproject/make_valid e i test CLI proj-gated. Senza questo job quei
  # rami erano verificati solo localmente — lint pedantic su pair.rs sono
  # emersi mesi dopo perche' nessuna CI li compilava (M3, ADR-0012).
  # Solo Linux: e' la piattaforma di riferimento dei backend; le dipendenze
  # di build (cmake, sqlite3) sono quelle documentate in ADR-0012.
  backends:
    name: test full-backends (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify candidate revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Dipendenze native (proj-sys bundled, geos static)
        run: sudo apt-get update && sudo apt-get install -y cmake sqlite3 libsqlite3-dev

      - name: Installa toolchain (baseline ICD R13.1)
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy

      - name: Cache cargo (backends)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Chiave separata: gli artefatti nativi dei backend non sono
          # riusabili tra feature set diversi.
          key: cargo-ci-backends-1.92.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ci-backends-1.92.0-

      - name: Clippy full-backends (gate)
        run: >
          cargo clippy -p plenora-kernels-geo -p plenora-engine -p plenora-cli
          --all-targets --locked --features full-backends

      # Gate R6 sul perimetro feature-gated: i rami geos/proj non sono
      # compilati dal job `test` (default features), quindi una primitiva di
      # panic dietro `cfg(feature = "geos-backend")` o `"proj-backend"`
      # sfuggirebbe al gate principale. Stessa lista di lint, stessa regola
      # sul cap-lints: il gate deve restare bloccante.
      - name: Gate anti-panic full-backends (R6)
        run: >
          cargo clippy -p plenora-kernels-geo -p plenora-engine -p plenora-cli
          --lib --bins --locked --features full-backends --
          -D unsafe-code
          -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
          -D clippy::unreachable -D clippy::todo -D clippy::unimplemented

      - name: Test full-backends
        run: >
          cargo test -p plenora-kernels-geo -p plenora-engine -p plenora-cli
          --locked --features full-backends

  # Gate di coverage. Fino al 2026-08-06 `scripts/coverage.sh` esisteva ma
  # nessun workflow lo invocava: la coverage era una misura facoltativa, non
  # un vincolo — l'unico dei tre repo Plenora senza gate (plenora-IO-tools e
  # plenora-database-tools lo hanno da tempo, soglia lines 80).
  #
  # Il job non riusa scripts/coverage.sh perche' quello script gira dentro il
  # container rust:1.92 (toolchain riproducibile in locale): sul runner la
  # toolchain pinnata c'e' gia' e il docker-in-docker sarebbe solo overhead.
  # Le soglie sono le stesse nei due punti — se cambiano qui, vanno cambiate
  # anche nello script, che e' il modo di riprodurre il verdetto in locale.
  #
  # Perimetro: feature di default. I backend nativi (geos static, proj
  # bundled) NON sono strumentati — il loro codice feature-gated e' compilato
  # e testato dal job `backends`, ma resta fuori dalla misura di coverage.
  # Coprirlo qui raddoppierebbe il tempo del job per compilare C/C++ da
  # sorgente sotto strumentazione.
  #
  # Soglie: misura reale del 2026-08-06 su rust:1.92, feature di default
  # (lines 93.44%, functions 87.61%, regions 92.43%), arrotondata per difetto
  # con ~3 punti di margine. Sono deliberatamente piu' alte del minimo dei
  # repo gemelli (80): a 80 il gate sarebbe inerte su questo codebase e non
  # segnalerebbe alcuna regressione. Ogni futuro spostamento delle soglie va
  # fatto con la misura in mano, mai a stima.
  coverage:
    name: gate coverage (linux)
    runs-on: ubuntu-latest
    env:
      # Stessa directory usata da scripts/coverage.sh: gli artefatti
      # strumentati non sono riusabili dalle build normali.
      CARGO_TARGET_DIR: target-cov
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify candidate revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Installa toolchain (baseline ICD R13.1)
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: llvm-tools-preview

      - name: Cache cargo (coverage)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target-cov
          # Chiave separata: gli artefatti strumentati non sono riusabili
          # dai job di test.
          key: cargo-ci-cov-1.92.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ci-cov-1.92.0-

      # Versione pinnata come ogni altra dipendenza (R13.2): un aggiornamento
      # del tool puo' spostare i conteggi e quindi il verdetto del gate.
      - name: Installa cargo-llvm-cov (pin 0.8.7)
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked

      - name: Misura coverage del workspace
        run: cargo llvm-cov --workspace --locked --no-report

      # Il report LCOV e' l'unico modo per capire *dove* la coverage e'
      # scesa quando il gate qui sotto fallisce: senza artifact resta solo
      # un numero. Stesso trattamento in plenora-IO-tools.
      - name: Esporta report LCOV
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-lcov
          path: lcov.info
          if-no-files-found: error

      - name: Gate coverage (lines 90 / functions 85 / regions 89)
        run: >
          cargo llvm-cov report --summary-only
          --fail-under-lines 90
          --fail-under-functions 85
          --fail-under-regions 89

  # Gate del manifesto di rilascio (PLENORA-CRITERI-RC, criteri C1-C5):
  # verifica forma e revisioni di release/*.json con il checker ufficiale,
  # clonato da plenora-contracts pinnato alla revisione ICD citata dal
  # manifesto stesso (aggiornare il pin quando il manifesto riallinea).
  release-manifest:
    name: gate manifesto di rilascio
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: il checker verifica che le revisioni citate esistano
      # nella storia (git cat-file).
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify candidate revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Installa toolchain (baseline ICD R13.1)
        uses: dtolnay/rust-toolchain@1.92.0

      # Il checker del candidato resta nel repo e i suoi test girano sempre:
      # serve al prossimo candidato in volo, non a una versione specifica.
      - name: Mutation test checker del candidato
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest scripts.test_check_release_candidate

      # Nessun candidato in volo. `check_release_candidate.py` va invocato solo
      # finche' il tag non esiste: verifica proprio che il tag intended NON sia
      # ancora stato creato. Ritirato il 2026-08-06, quando si e' visto che lo
      # step era sopravvissuto al tag v1.0.3 (ac52a15) e faceva fallire ogni
      # push su main con "candidate tag v1.0.3 must not already exist". Stesso
      # trattamento gia' dato a 1.0.2, 1.0.1, 1.0.0 e rc1: a tag creato il
      # manifesto passa nella lista storica qui sotto.
      #
      # Quando si apre il prossimo candidato, reintrodurre qui lo step:
      #   - name: Verifica identita candidato release X.Y.Z
      #     run: PYTHONDONTWRITEBYTECODE=1 python scripts/check_release_candidate.py release/X.Y.Z.json --repo . --verify-github-run
      # e spostarlo nella lista storica appena il tag e' creato.

      - name: Verifica lockfile fuzz
        run: cargo check --manifest-path fuzz/Cargo.toml --locked

      # Audit supply-chain sui lockfile. Fino al 2026-08-06 questo repo non
      # aveva alcun controllo sulle advisory RUSTSEC: era l'unico gate di
      # sicurezza presente in plenora-IO-tools e assente qui. Entrambi i
      # lockfile sono coperti — quello del fuzz ha un grafo suo e non e'
      # verificato dall'audit del workspace.
      #
      # Versione pinnata (R13.2): il verdetto dipende dal tool oltre che dal
      # database. Misura del 2026-08-06 con 0.22.2: workspace 187 dipendenze
      # e fuzz 152, zero advisory, nessun --ignore necessario.
      #
      # `--deny warnings` fa fallire anche unmaintained e yanked, non solo le
      # vulnerabilita'. Quando una advisory nuova rende rosso il gate, la
      # deroga si scrive come `--ignore RUSTSEC-YYYY-NNNN` con la motivazione
      # accanto, come fa plenora-IO-tools: mai abbassando --deny.
      - name: Installa cargo-audit (pin 0.22.2)
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit advisory del workspace
        run: cargo audit --deny warnings

      - name: Audit advisory del progetto fuzz
        run: cargo audit --deny warnings --file fuzz/Cargo.lock

      - name: Clone plenora-contracts (pin v2.0-rc10)
        run: git clone --depth 1 --branch v2.0-rc10 https://github.com/PlenoraETL/plenora-contracts.git "$RUNNER_TEMP/plenora-contracts"

      - name: Verifica manifesto storico 1.0.3
        run: python "$RUNNER_TEMP/plenora-contracts/scripts/check_release_manifest.py" release/1.0.3.json --repo .

      - name: Verifica manifesto storico 1.0.2
        run: python "$RUNNER_TEMP/plenora-contracts/scripts/check_release_manifest.py" release/1.0.2.json --repo .

      - name: Verifica manifesto storico 1.0.1
        run: python "$RUNNER_TEMP/plenora-contracts/scripts/check_release_manifest.py" release/1.0.1.json --repo .

      - name: Verifica manifesto storico 1.0.0
        run: python "$RUNNER_TEMP/plenora-contracts/scripts/check_release_manifest.py" release/1.0.0.json --repo .

      - name: Verifica manifesto storico rc1
        run: python "$RUNNER_TEMP/plenora-contracts/scripts/check_release_manifest.py" release/rc.json --repo .
