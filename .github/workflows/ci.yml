# CI base: build e test su ogni push/PR.
#
# Senza un gate di test su ogni push un test rosso sopravvive su main
# finche' qualcuno non lo esegue a mano. Questo workflow e' il minimo
# sindacale per impedirlo.
#
# Matrice Linux/Windows: il publish atomico (errori-e-limiti.md#publish-e-cleanup) ha rami per
# piattaforma (cfg) che un test solo-Linux non eserciterebbe.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permessi minimi ed espliciti: nessun job qui usa `GITHUB_TOKEN`, quindi la
# sola lettura del contenuto basta. Senza questa riga il token eredita i
# permessi di default del repository, che possono essere in scrittura: un
# passo compromesso avrebbe potuto scrivere sul repository che sta
# verificando.
permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify candidate revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Installa toolchain (baseline ICD R13.1)
        # Versione esatta fissata anche in rust-toolchain.toml per lo
        # sviluppo locale; qui la ripetiamo esplicitamente perche' la CI
        # non deve dipendere dal canale "stable" mobile.
        # Pin a SHA completa: `@1.98.0` e' un ramo mobile, quindi lo stesso
        # commit potrebbe essere verificato con codice di action diverso. Con
        # la SHA il ramo non seleziona piu' la toolchain, che va percio'
        # dichiarata esplicitamente qui.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-23
        with:
          toolchain: 1.98.0
          components: clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # La chiave include la toolchain: artefatti compilati da versioni
          # diverse del compilatore non sono riusabili: un restore
          # incrociato finisce in ld bus error.
          key: cargo-ci-1.98.0-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ci-1.98.0-${{ matrix.os }}-

      # R13.2: --locked. Un Cargo.lock modificato dalla build e' un
      # fallimento, non un aggiornamento.
      - name: Test workspace
        run: cargo test --workspace --locked --no-fail-fast

      # Gate R6 (ICD): nel codice di produzione nessuna primitiva di panic e
      # nessun unsafe. Bloccante. MAI aggiungere --cap-lints=warn: cappera'
      # anche i -D espliciti declassandoli a warn: il gate smetterebbe di
      # bloccare senza dirlo, e i siti si accumulerebbero in silenzio. I
      # lint di stile sono gia' deny da workspace.lints con zero warning,
      # non serve alcun cap.
      #
      # Il perimetro comprende plenora-cli con --bins: la CLI e' codice di
      # produzione a tutti gli effetti (e' l'unico eseguibile distribuito)
      # ma non ha target --lib, quindi senza --bins resterebbe fuori dal
      # gate. `--lib --bins` copre entrambe le forme senza allargare il
      # gate ai target di test, dove le primitive di panic restano
      # legittime.
      - name: Gate anti-panic (R6)
        run: >
          cargo clippy -p plenora-core -p plenora-engine
          -p plenora-kernels-table -p plenora-kernels-geo -p plenora-cli
          --lib --bins --locked --
          -D unsafe-code
          -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
          -D clippy::unreachable -D clippy::todo -D clippy::unimplemented

      # Clippy bloccante: tutti i gruppi lint, pedantic e nursery
      # compresi, sono deny da workspace.lints e il codebase passa con
      # zero warning. E' questo gate a impedire che il debito lint si
      # riaccumuli.
      - name: Clippy (gate)
        run: cargo clippy --workspace --all-targets --locked

      # `--all-targets` da solo **salta** gli esempi con `required-features`.
      # Senza questo passo la sonda di calibrazione uscirebbe in silenzio
      # dalla copertura di clippy: compilerebbe solo quando qualcuno la lancia
      # a mano, cioe' dopo che si e' gia' rotta.
      - name: Clippy (esempi con required-features)
        run: cargo clippy -p plenora-engine --all-targets --locked --features internals

      # errori-e-limiti.md#memoria-governata: il budget di memoria della libreria si chiama
      # `max_governed_memory_bytes` e NON ha alias. Il nome della v4 vive
      # solo nel modulo di migrazione. Senza questo gate la decisione
      # sopravvive finche' qualcuno non riaggiunge il vecchio nome «per
      # compatibilita'»: e' esattamente il modo in cui una promessa
      # ritirata torna in circolazione.
      - name: Gate nome del budget di memoria (errori-e-limiti.md#memoria-governata)
        run: python scripts/verifica_nome_budget_memoria.py

  # I gate che leggono i SORGENTI, in un job proprio.
  #
  # release.md impone job separati, e la ragione e' operativa: in serie il
  # primo fallimento nasconde tutto cio' che segue, e questi due non
  # dipendono ne' l'uno dall'altro ne' dalla compilazione. Tenerli come step
  # del job `test` significherebbe che un assert di troppo impedisce di
  # vedere nella stessa esecuzione lo stato del pin delle action.
  #
  # Nessuna toolchain Rust: leggono testo.
  gate-assert:
    name: gate assert nel codice di produzione
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify candidate revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Il gate R6 copre le primitive che Clippy sa nominare, ma non le macro
      # di assert: `assert!`, `assert_eq!`, `assert_ne!` e le varianti
      # `debug_assert*` sono panici a tutti gli effetti e non hanno un lint
      # corrispondente. Senza questo gate la promessa «nel codice di
      # produzione non esistono primitive di panico» sarebbe piu' larga del
      # controllo che dovrebbe imporla, e un `debug_assert_eq!` potrebbe
      # sopravvivere anche in un percorso che tiene il mutex della
      # contabilita'.
      - name: Gate assert nel codice di produzione (errori-e-limiti.md#panic-policy)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/verifica_assenza_assert.py

  # Secondo gate sui sorgenti, in un job PROPRIO e non in coda al primo.
  #
  # In serie GitHub salta lo step successivo appena uno fallisce: un assert
  # di troppo impedirebbe di vedere nella stessa esecuzione lo stato del pin
  # delle action. E' esattamente l'oscuramento che release.md vieta.
  gate-pin-action:
    name: gate pin delle action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify candidate revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Le action sono pinnate a SHA completa: questo gate impedisce che un
      # tag o un ramo mobile rientri di soppiatto in un workflow o in una
      # composite action locale.
      - name: Gate pin delle action (release.md)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/verifica_pin_workflow.py

      # I target fuzz sono elencati in quattro posti e tre sono copie a mano.
      # Se una rinomina ne aggiorna uno solo, la campagna locale si ferma
      # sul target inesistente e lo smoke esce 0 comunque: la copertura
      # mancante non si vedrebbe da nessuna parte.
      - name: Gate elenchi dei target fuzz
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/verifica_target_fuzz.py

  # Backend nativi (GEOS static, PROJ bundled): i rami feature-gated di
  # reproject/make_valid e i test CLI proj-gated. Senza questo job quei
  # rami sarebbero verificati solo localmente: un lint pedantic su pair.rs
  # resterebbe invisibile finche' qualcuno non li compila a mano
  # (architettura.md#geometrie).
  # Solo Linux: e' la piattaforma di riferimento dei backend; le dipendenze
  # di build (cmake, sqlite3) sono quelle documentate in architettura.md#geometrie.
  backends:
    name: test full-backends (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify candidate revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Dipendenze native (proj-sys bundled, geos static)
        run: sudo apt-get update && sudo apt-get install -y cmake sqlite3 libsqlite3-dev

      - name: Installa toolchain (baseline ICD R13.1)
        # Pin a SHA completa: `@1.98.0` e' un ramo mobile, quindi lo stesso
        # commit potrebbe essere verificato con codice di action diverso. Con
        # la SHA il ramo non seleziona piu' la toolchain, che va percio'
        # dichiarata esplicitamente qui.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-23
        with:
          toolchain: 1.98.0
          components: clippy

      - name: Cache cargo (backends)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Chiave separata: gli artefatti nativi dei backend non sono
          # riusabili tra feature set diversi.
          key: cargo-ci-backends-1.98.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ci-backends-1.98.0-

      - name: Clippy full-backends (gate)
        run: >
          cargo clippy -p plenora-kernels-geo -p plenora-engine -p plenora-cli
          --all-targets --locked --features full-backends

      # Gate R6 sul perimetro feature-gated: i rami geos/proj non sono
      # compilati dal job `test` (default features), quindi una primitiva di
      # panic dietro `cfg(feature = "geos-backend")` o `"proj-backend"`
      # sfuggirebbe al gate principale. Stessa lista di lint, stessa regola
      # sul cap-lints: il gate deve restare bloccante.
      - name: Gate anti-panic full-backends (R6)
        run: >
          cargo clippy -p plenora-kernels-geo -p plenora-engine -p plenora-cli
          --lib --bins --locked --features full-backends --
          -D unsafe-code
          -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
          -D clippy::unreachable -D clippy::todo -D clippy::unimplemented

      - name: Test full-backends
        run: >
          cargo test -p plenora-kernels-geo -p plenora-engine -p plenora-cli
          --locked --features full-backends

  # Gate di coverage. Senza un job che la invochi, `scripts/coverage.sh`
  # resterebbe una misura facoltativa e non un vincolo; i due repo gemelli
  # (plenora-IO-tools, plenora-database-tools) hanno lo stesso gate con
  # soglia lines 80.
  #
  # Il job non riusa scripts/coverage.sh perche' quello script gira dentro il
  # container rust:1.98 (toolchain riproducibile in locale): sul runner la
  # toolchain pinnata c'e' gia' e il docker-in-docker sarebbe solo overhead.
  # Le soglie sono le stesse nei due punti — se cambiano qui, vanno cambiate
  # anche nello script, che e' il modo di riprodurre il verdetto in locale.
  # La PULIZIA invece non e' duplicata: e' lo stesso
  # `scripts/pulisci_coverage.py` che coverage.sh invoca nel container, ed e'
  # lo script stesso a pretendere — a ogni invocazione, quindi anche qui —
  # che entrambi i percorsi lo chiamino PRIMA di misurare.
  #
  # Perimetro: feature di default. I backend nativi (geos static, proj
  # bundled) NON sono strumentati — il loro codice feature-gated e' compilato
  # e testato dal job `backends`, ma resta fuori dalla misura di coverage.
  # Coprirlo qui raddoppierebbe il tempo del job per compilare C/C++ da
  # sorgente sotto strumentazione.
  #
  # Soglie: misura reale su rust:1.92, feature di default
  # (lines 93.44%, functions 87.61%, regions 92.43%), arrotondata per difetto
  # con ~3 punti di margine. Sono deliberatamente piu' alte del minimo dei
  # repo gemelli (80): a 80 il gate sarebbe inerte su questo codebase e non
  # segnalerebbe alcuna regressione. Ogni futuro spostamento delle soglie va
  # fatto con la misura in mano, mai a stima.
  coverage:
    name: gate coverage (linux)
    runs-on: ubuntu-latest
    env:
      # Stessa directory usata da scripts/coverage.sh: gli artefatti
      # strumentati non sono riusabili dalle build normali.
      CARGO_TARGET_DIR: target-cov
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify candidate revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Installa toolchain (baseline ICD R13.1)
        # Pin a SHA completa: `@1.98.0` e' un ramo mobile, quindi lo stesso
        # commit potrebbe essere verificato con codice di action diverso. Con
        # la SHA il ramo non seleziona piu' la toolchain, che va percio'
        # dichiarata esplicitamente qui.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-23
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview

      - name: Cache cargo (coverage)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target-cov
          # Chiave separata: gli artefatti strumentati non sono riusabili
          # dai job di test.
          # Il suffisso `v3` va incrementato ogni volta che cambia cio'
          # che il job pretende di NON trovare sul disco: le cache di
          # GitHub sono IMMUTABILI, quindi una cache scritta prima
          # continua a ripristinare proprio i residui che la pulizia
          # elimina, e la `restore-keys` di una versione piu' vecchia li
          # rimetterebbe a ogni giro successivo. Le due classi che hanno
          # richiesto un incremento sono i `.profraw` accumulati e i
          # BINARI STRUMENTATI delle build precedenti, la cui mappa di
          # copertura gonfia il denominatore con righe che nessun test
          # esegue.
          key: cargo-ci-cov-v3-1.98.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ci-cov-v3-1.98.0-

      # Versione pinnata come ogni altra dipendenza (R13.2): un aggiornamento
      # del tool puo' spostare i conteggi e quindi il verdetto del gate.
      - name: Installa cargo-llvm-cov (pin 0.8.7)
        id: llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked

      # Due classi di residuo, entrambe ripristinate dalla cache, entrambe
      # rimosse qui — dallo stesso script che invoca scripts/coverage.sh.
      #
      # I `.profraw` hanno nomi che contengono il pid, e il pid il sistema lo
      # ricicla: con i profili di una esecuzione precedente ancora sul disco —
      # ed e' esattamente cio' che la cache ripristina — un processo nuovo
      # trova il proprio nome occupato, LLVM scrive l'errore su STDERR, e i
      # test che pretendono stderr vuoto falliscono per una ragione che non
      # ha nulla a che vedere col codice. Bastano poche migliaia di profili
      # accumulati perche' le campagne diventino rosse, e tornino verdi
      # subito dopo la pulizia.
      #
      # I BINARI STRUMENTATI di una build precedente sono il difetto opposto e
      # silenzioso: portano la mappa di copertura del codice di allora, le
      # loro righe entrano nel denominatore senza che nessun test le esegua e
      # il gate misura piu' basso del vero. Nessun errore, solo un numero
      # sbagliato — un gate non ermetico che produce rossi falsi.
      - name: Pulisci gli artefatti della campagna precedente
        run: python scripts/pulisci_coverage.py

      - name: Misura coverage del workspace
        run: cargo llvm-cov --workspace --locked --no-report

      # Il report LCOV e' l'unico modo per capire *dove* la coverage e'
      # scesa quando il gate qui sotto fallisce: senza artifact resta solo
      # un numero. Stesso trattamento in plenora-IO-tools.
      - name: Esporta report LCOV
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-coverage-lcov
          path: lcov.info
          if-no-files-found: error

      - name: Gate coverage (lines 90 / functions 85 / regions 89)
        run: >
          cargo llvm-cov report --summary-only
          --fail-under-lines 90
          --fail-under-functions 85
          --fail-under-regions 89

      # `always()`: anche quando il gate sopra fallisce. I residui non devono
      # finire nella cache, altrimenti il prossimo job riparte con il problema
      # che questo ha appena risolto — e la cache, essendo immutabile, se lo
      # porterebbe dietro fino al prossimo cambio di `Cargo.lock`.
      #
      # Pulizia COMPLETA, non solo i profili, per tre ragioni:
      #
      #   - peso. In LOCALE, a fine campagna, `target-cov` arriva a
      #     5 748 file / 7,49 GiB di spazio occupato, di cui
      #     4 481 file e 6,78 GiB — il 90% dei byte — artefatti del workspace
      #     che la pulizia a inizio job cancella comunque. Qui la cifra e'
      #     piu' bassa, perche' `CARGO_INCREMENTAL: 0` toglie di mezzo
      #     `debug/incremental/`, che in locale e' la fetta grossa; la classe
      #     pero' e' la stessa, e salvarla significa spendere upload, download
      #     e quota per roba buttata prima di essere usata;
      #   - quota. Il limite di GitHub e' 10 GB per repository, condivisi con
      #     le cache dei job `test` e `backends`: una cache di coverage gonfia
      #     sfratta per anzianita' proprio le dipendenze che la rendono utile;
      #   - difesa in profondita'. Se un domani la pulizia a inizio job venisse
      #     indebolita, una cache senza binari strumentati non avrebbe nulla da
      #     restituire: il difetto resterebbe senza combustibile.
      #
      # In locale `scripts/coverage.sh` fa invece la sola pulizia dei profili:
      # li' non c'e' cache da proteggere, e gli artefatti servono a rieseguire
      # `cargo llvm-cov report --html` dopo una campagna rossa per vedere DOVE
      # e' scesa. Qui quel bisogno lo copre l'artifact LCOV caricato sopra.
      #
      # La condizione sull'installazione del tool: `clean` e' un sottocomando
      # di cargo-llvm-cov, e se il job e' morto prima di installarlo non c'e'
      # niente da pulire (nessuna misura e' partita) ne' con che cosa farlo.
      - name: Pulisci gli artefatti prima della cache
        if: always() && steps.llvm-cov.conclusion == 'success'
        run: python scripts/pulisci_coverage.py

  # `docs/operazioni.md` e' generato: il file committato deve coincidere
  # BYTE PER BYTE con la rigenerazione.
  #
  # Senza questo gate un generatore rotto non rompe nulla di visibile: se
  # rustfmt riformatta la macro `op!` del catalogo e la regex del parser
  # smette di agganciarla, lo script esce con MISMATCH e non riscrive
  # niente — il documento resta com'e' e sembra aggiornato, e la CI resta
  # verde perche' nessuno rigenera.
  #
  # Nessuna dipendenza: `assemble.py` usa la sola libreria standard. Niente
  # pip, niente container, niente font: il PDF non fa parte di questo
  # repository (documentazione obsoleta, non una capacita' di data-tools).
  #
  # Job PROPRIO, come i manifesti: un documento fuori data non deve nascondere
  # un test rosso, ne' viceversa.
  docs-riproducibili:
    name: gate documentazione
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify candidate revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Il gate lavora su una COPIA e confronta li'. Un gate che rigenera il
      # file che sta verificando non verifica nulla: dichiara verde qualunque
      # cosa produca.
      - name: Copia il repository fuori dal worktree
        run: cp -a "$GITHUB_WORKSPACE" "$RUNNER_TEMP/doc-check"

      # Il gate documentale copre superficie, collegamenti, riferimenti
      # morti, allineamento catalogo/operazioni, divergenza del generato e
      # artefatti tracciati. Gira sulla COPIA, come la rigenerazione.
      - name: Superficie, collegamenti e documento generato
        working-directory: ${{ runner.temp }}/doc-check
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/verifica_documentazione.py

      # I siti di allocazione e prenotazione descritti in
      # docs/errori-e-limiti.md devono esistere ancora nella forma descritta.
      # Un documento che descrive una garanzia marcisce in silenzio: basta
      # spostare una reservation e il testo resta convincente e falso.
      - name: Memoria governata coerente con la descrizione
        working-directory: ${{ runner.temp }}/doc-check
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/verifica_memoria_governata.py

      # Il controllo va fatto sulla COPIA, che e' l'unico albero che il gate
      # ha toccato: verificare il worktree originale non direbbe niente, ed e'
      # proprio li' che una futura `--verify` che scrivesse resterebbe
      # invisibile. `--untracked-files=all` perche' un file NUOVO e' una
      # scrittura quanto un file modificato.
      - name: La verifica non ha scritto nella copia
        working-directory: ${{ runner.temp }}/doc-check
        run: |
          residuo="$(git status --porcelain --untracked-files=all)"
          if [ -n "$residuo" ]; then
            echo "la verifica ha modificato la copia su cui lavorava:"
            echo "$residuo"
            exit 1
          fi

  # Verifica dei manifesti di rilascio STORICI (rc-1.0.3), con il checker che
  # vive in QUESTO repository (`scripts/check_release_manifest.py`).
  #
  # Il checker NON va clonato da `plenora-contracts`: quel repository e'
  # stato sostituito senza riportare storia, branch e tag, e il suo
  # contenuto e' una NUOVA linea normativa. Non lo si clona e non lo si
  # consulta: i manifesti storici sono documenti immutabili e non vanno
  # reinterpretati con regole nate dopo di loro. I manifesti futuri
  # richiederanno un profilo separato del checker, costruito sulla nuova
  # struttura.
  #
  # Tre gate distinti (manifesti, audit, compilazione fuzz) in JOB separati.
  # In un job solo sarebbero step in serie, e un errore di compilazione del
  # crate fuzz renderebbe `skipped` tutti quelli successivi. Spostare
  # l'ordine non basta: con controlli in serie il primo fallimento nasconde
  # sempre tutto cio' che segue.
  release-manifest:
    name: gate manifesto storico ${{ matrix.manifest }}
    runs-on: ubuntu-latest
    strategy:
      # I cinque manifesti sono indipendenti: quello rotto non deve impedire
      # di sapere lo stato degli altri quattro.
      fail-fast: false
      matrix:
        manifest: ["rc", "1.0.0", "1.0.1", "1.0.2", "1.0.3"]
    steps:
      # fetch-depth 0: il checker verifica che le revisioni e i tag citati
      # esistano nella storia (git cat-file, rev-parse, merge-base).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify candidate revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Verifica manifesto storico ${{ matrix.manifest }}
        run: python scripts/check_release_manifest.py release/${{ matrix.manifest }}.json --repo .

  # I test dei due checker stanno in un job PROPRIO: un manifesto rotto non
  # deve nascondere un checker rotto, ne' viceversa.
  #
  # Nessun candidato in volo. `check_release_candidate.py` va invocato solo
  # finche' il tag non esiste: verifica proprio che il tag intended NON sia
  # ancora stato creato. Lasciato in piedi dopo la creazione del tag, fa
  # fallire ogni push su main con "candidate tag X.Y.Z must not already
  # exist": per questo qui non c'e'.
  #
  # Quando si apre il prossimo candidato, reintrodurre qui lo step:
  #   - name: Verifica identita candidato release X.Y.Z
  #     run: PYTHONDONTWRITEBYTECODE=1 python scripts/check_release_candidate.py release/X.Y.Z.json --repo . --verify-github-run
  # e aggiungere la nuova versione alla matrix dei manifesti storici appena il
  # tag e' creato.
  release-checkers:
    name: gate test dei checker di rilascio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify candidate revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Mutation test checker del candidato
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest scripts.test_check_release_candidate

      # `if: always()`: i due checker sono indipendenti.
      - name: Mutation test checker dei manifesti storici
        if: always()
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest scripts.test_check_release_manifest

  # Audit supply-chain sui lockfile: senza questo job nessun controllo
  # osserverebbe le advisory RUSTSEC. Entrambi i lockfile sono coperti —
  # quello del fuzz ha un grafo suo e non e' verificato dall'audit del
  # workspace.
  #
  # Versione pinnata (R13.2): il verdetto dipende dal tool oltre che dal
  # database. Con la versione pinnata qui i due grafi passano puliti, senza
  # alcun --ignore.
  #
  # `--deny warnings` fa fallire anche unmaintained e yanked, non solo le
  # vulnerabilita'. Quando una advisory nuova rende rosso il gate, la deroga si
  # scrive come `--ignore RUSTSEC-YYYY-NNNN` con la motivazione accanto, come
  # fa plenora-IO-tools: mai abbassando --deny.
  supply-chain-audit:
    name: gate audit supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify candidate revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Installa toolchain (baseline ICD R13.1)
        # Pin a SHA completa: `@1.98.0` e' un ramo mobile, quindi lo stesso
        # commit potrebbe essere verificato con codice di action diverso. Con
        # la SHA il ramo non seleziona piu' la toolchain, che va percio'
        # dichiarata esplicitamente qui.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-23
        with:
          toolchain: 1.98.0

      - name: Installa cargo-audit (pin 0.22.2)
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit advisory del workspace
        run: cargo audit --deny warnings

      # `if: always()`: i due lockfile sono indipendenti e una advisory
      # sull'uno non deve impedire di sapere lo stato dell'altro.
      - name: Audit advisory del progetto fuzz
        if: always()
        run: cargo audit --deny warnings --file fuzz/Cargo.lock

  # Compilazione dell'INTERO progetto fuzz (tutti i `[[bin]]` dei target), su
  # toolchain stabile e `--locked`: niente campagna libFuzzer, niente nightly,
  # niente sanitizer.
  #
  # E' il solo gate che compila questo crate: `fuzz/` e' fuori dai `members`
  # del workspace, quindi `cargo check/clippy/test --workspace` non lo tocca, e
  # i target sono consumatori delle API pubbliche dei cinque crate: una
  # variante aggiunta a un enum pubblico rompe un `match` esaustivo nei
  # target senza che alcun gate del workspace se ne accorga.
  #
  # Il compilatore C++ serve al build script di `libfuzzer-sys`: sui runner
  # GitHub c'e' gia'; in container va installato (`g++`).
  fuzz-build:
    name: gate compilazione target fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify candidate revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Installa toolchain (baseline ICD R13.1)
        # Pin a SHA completa: `@1.98.0` e' un ramo mobile, quindi lo stesso
        # commit potrebbe essere verificato con codice di action diverso. Con
        # la SHA il ramo non seleziona piu' la toolchain, che va percio'
        # dichiarata esplicitamente qui.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-23
        with:
          toolchain: 1.98.0

      - name: Compilazione dei target fuzz (stabile, --locked)
        run: cargo check --manifest-path fuzz/Cargo.toml --locked
