name: ci

# I gate di AGENTS.md, «Prima del commit», eseguiti su Linux e Windows a ogni
# push su main e a ogni pull request. I target di fuzz qui si compilano
# soltanto: le campagne sono in fuzz.yml; la catena delle dipendenze sta
# in supply-chain.yml e la copertura in coverage.yml.

on:
  push:
    branches: [main]
  pull_request:

# Sola lettura: nessun job scrive sul repository, pubblica o commenta.
permissions:
  contents: read

# Un push successivo cancella la run in corso sullo stesso riferimento.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Guardie statiche in Python, senza toolchain Rust: documenti, commenti,
  # documento generato e le prove delle guardie stesse. Solo libreria
  # standard, quindi nessun requisito da installare. Una guardia offline
  # nuova entra in questo job.
  guardie:
    name: guardie statiche (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # Testo UTF-8 anche sulla console di Windows.
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - name: tutte le guardie e i self-test
        run: python scripts/esegui_guardie.py

  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Un sistema che fallisce non nasconde l'esito dell'altro.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # La versione esatta la fissa `rust-toolchain.toml`; qui si installano
      # solo i componenti.
      - name: Rust 1.98.1 + rustfmt + clippy
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.98.1
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      # Senza `--all`: `--all` formatta anche le dipendenze per percorso,
      # cioe' i crate di `vendor/` (codice upstream, non nostro); senza, il
      # controllo copre tutti i membri del workspace.
      - name: cache Cargo per gli avvisi dei target distribuiti
        run: cargo fetch --locked
      - name: catalogo degli item pubblici Arrow e Parquet al lock
        run: python scripts/genera_arrow_items.py --check
      - name: avvisi dei crate (quattro grafi release, offline)
        run: python scripts/avvisi_crate.py
      - name: cargo fmt
        if: ${{ !cancelled() }}
        run: cargo fmt --check
      - name: cargo fmt (target di fuzz)
        if: ${{ !cancelled() }}
        run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - name: cargo clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: prova compilata dei divieti degli esiti
        env:
          PLENORA_PROVA_CLIPPY: '1'
        run: python -m unittest discover -s scripts -p "test_clippy_esito.py"
      # `fuzz/` ha workspace e lock separati per tenere nightly e libFuzzer
      # fuori dalla toolchain fissata: senza un comando dedicato potrebbe
      # smettere di compilare lasciando verde tutto il resto.
      - name: cargo check (target di fuzz)
        if: ${{ !cancelled() }}
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked
      - name: cargo clippy anti-panic (librerie)
        if: ${{ !cancelled() }}
        run: >-
          cargo clippy --workspace --lib --locked --
          -D unsafe-code
          -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
          -D clippy::unreachable -D clippy::todo -D clippy::unimplemented
      - name: cargo test (suite lunga)
        if: ${{ !cancelled() }}
        env:
          PLENORA_TEST_LUNGHI: '1'
        run: cargo test --workspace --locked --no-fail-fast
      # Le sonde delle prove (feature `sonde-di-prova`, disattivata per
      # default e assente dalle build di rilascio) si compilano solo con la
      # feature: lint, anti-panic e la prova dei loro punti a parte.
      - name: cargo clippy (sonde-di-prova)
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: cargo clippy anti-panic (sonde-di-prova)
        if: ${{ !cancelled() }}
        run: >-
          cargo clippy --workspace --lib --all-features --locked --
          -D unsafe-code
          -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
          -D clippy::unreachable -D clippy::todo -D clippy::unimplemented
      - name: cargo test (punti delle sonde)
        if: ${{ !cancelled() }}
        run: cargo test -p plenora-io --features sonde-di-prova --test sonda_dei_controlli --locked
  contratti:
    name: CLI contro plenora-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Lo stesso commit fissato in scripts/verifica_cli_contratti.py.
      - name: plenora-contracts al commit fissato
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PlenoraETL/plenora-contracts
          ref: 38d68b402389855edbcecb7ce57c31e91282cb4e
          path: .plenora-contracts
          # Il censimento confronta anche il pin precedente.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - name: validatore dei contratti (versioni fissate dai contratti)
        run: python -m pip install -r .plenora-contracts/requirements-validation.txt
      - name: adozione, vettori, messaggi e oracolo della cache al pin
        run: python scripts/verifica_adozione.py --contratti .plenora-contracts
      - name: Rust 1.98.1
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.98.1
        with:
          toolchain: '1.98.1'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: costruisce la CLI
        run: cargo build --locked -p plenora-cli
      - name: vettori Arrow Geometry Semantics al pin (API e CLI)
        run: cargo test -p plenora-cli --test geometry_semantics --locked
      - name: verifica con jsonschema e i controlli dei contratti
        run: >-
          python scripts/verifica_cli_contratti.py
          --binario target/debug/plenora-data
          --contratti .plenora-contracts

  dipendenze:
    name: politica comune delle dipendenze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - name: politica comune delle dipendenze
        env:
          PLENORA_REPO: plenora-data-tools2
        run: |
          cd .ci/plenora-dependencies
          echo '53683259c2acddc06245bf197abbdb4e9a4389f3ab2e550bebd89481d70f17ae  plenora-dependencies.toml' | sha256sum -c -
          # I checksum originali hanno CRLF: normalizzare solo lo stream dei nomi.
          tr -d '\r' < snapshot.sha256 | sha256sum -c -
          python3 controlla_dipendenze.py \
            --repo ../.. --nome "$PLENORA_REPO" \
            --json ../../dipendenze-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dipendenze-report
          path: dipendenze-report.json
          if-no-files-found: error
