name: sdk-python

# L'SDK Python `plenora-data` (crates/plenora-data-py): un wheel abi3 per
# Linux (manylinux 2_34) e per Windows, costruito con maturin, poi installato
# e provato su ogni piattaforma con il Python minimo e il piu' recente
# dichiarati (Python SDK 1.0, sezione 10: il wheel si prova installato, fuori
# dal checkout). La suite gira sul wheel delle prove, con le sonde (feature
# `sonde-di-prova`); il wheel di rilascio, senza, si verifica senza sonde.
# I tipi PEP 561 si controllano con mypy --strict sugli
# stessi due Python. Niente pubblicazione: i wheel restano artefatti della
# run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Sola lettura: nessun job scrive sul repository, pubblica o commenta.
permissions:
  contents: read

# Un push successivo cancella la run in corso sullo stesso riferimento.
concurrency:
  group: sdk-python-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  wheel:
    name: wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # L'action e maturin sono dipendenze distinte e si fissano entrambe:
      # maturin e' quella di requirements-sdk-build.txt, il compilatore
      # quello di rust-toolchain.toml. `manylinux` vale solo su Linux.
      # Il wheel delle prove ha le sonde (feature `sonde-di-prova`): la
      # suite intera le usa. Il wheel di rilascio e' costruito come in
      # rilascio.yml, senza feature, e si verifica che non le abbia.
      - name: build del wheel delle prove (maturin, sonde-di-prova)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: '1.15.0'
          command: build
          args: >-
            --release
            --locked
            --features sonde-di-prova
            --out dist
            --manifest-path crates/plenora-data-py/Cargo.toml
          manylinux: '2_34'
          # L'immagine manylinux per digest (quella del rilascio 1.0.0): il
          # tag `latest` cambierebbe la toolchain C del wheel Linux fra due
          # build dello stesso commit. Su Windows l'input non si usa.
          container: 'quay.io/pypa/manylinux_2_34_x86_64@sha256:e4ca528d41ab66b3654110295d7a2c7bfa599ddbb6efb269ec21f7f73b88f1b6'
          rust-toolchain: '1.98.0'
      - name: build del wheel di rilascio (maturin, senza feature)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: '1.15.0'
          command: build
          args: >-
            --release
            --locked
            --out dist-rilascio
            --manifest-path crates/plenora-data-py/Cargo.toml
          manylinux: '2_34'
          # L'immagine manylinux per digest (quella del rilascio 1.0.0): il
          # tag `latest` cambierebbe la toolchain C del wheel Linux fra due
          # build dello stesso commit. Su Windows l'input non si usa.
          container: 'quay.io/pypa/manylinux_2_34_x86_64@sha256:e4ca528d41ab66b3654110295d7a2c7bfa599ddbb6efb269ec21f7f73b88f1b6'
          rust-toolchain: '1.98.0'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-rilascio-${{ matrix.os }}
          path: dist-rilascio/*.whl
          if-no-files-found: error

  prove:
    name: prove (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [wheel]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-${{ matrix.os }}
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: ambiente della suite (versioni fissate)
        run: python -m pip install -r requirements-sdk-tests.txt
      # Senza dipendenze: quelle della suite sono gia' fissate sopra, e il
      # wheel non deve portarne altre.
      - name: installa il wheel
        shell: bash
        run: python -m pip install --no-deps dist/*.whl
      - name: verifica del wheel installato e suite Python
        shell: bash
        run: >-
          python scripts/verifica_sdk_python.py
          --wheel "$(ls dist/*.whl)"
          --cartella "$RUNNER_TEMP/sdk-python"
      # Il wheel di rilascio: niente sonde (attributi del modulo e nomi nel
      # binario nativo) e la suite senza le prove marcate `sonde`.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-rilascio-${{ matrix.os }}
          path: dist-rilascio
      - name: wheel di rilascio senza sonde
        shell: bash
        run: |
          python -m pip install --no-deps --force-reinstall dist-rilascio/*.whl
          python scripts/verifica_sdk_python.py \
            --wheel "$(ls dist-rilascio/*.whl)" \
            --cartella "$RUNNER_TEMP/sdk-python-rilascio" \
            --rilascio

  tipi:
    name: tipi PEP 561 (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: mypy (versione fissata)
        run: python -m pip install -r requirements-sdk-typing.txt
      - name: mypy --strict sul pacchetto e sul consumatore di prova
        env:
          MYPYPATH: crates/plenora-data-py/python
        run: >-
          python -m mypy
          --config-file crates/plenora-data-py/typing/mypy.ini
          --cache-dir "$RUNNER_TEMP/mypy"
          crates/plenora-data-py/typing/sdk_contract.py
          crates/plenora-data-py/python/plenora_data
