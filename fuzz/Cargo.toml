[package]
name = "plenora-data-tools-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Crate cargo-fuzz separato (convenzione standard): NON membro del workspace
# principale. Le dipendenze path puntano ai crate del workspace; le versioni
# delle dipendenze comuni sono pinnate come in [workspace.dependencies].
[workspace]

[dependencies]
plenora-core = { path = "../crates/plenora-core" }
plenora-kernels-table = { path = "../crates/plenora-kernels-table" }
plenora-kernels-geo = { path = "../crates/plenora-kernels-geo" }
# `internals` espone il modulo `protocollo`, che nel crate resta privato:
# senza, il decoder del filo non sarebbe raggiungibile da qui.
plenora-engine = { path = "../crates/plenora-engine", features = ["internals"] }
libfuzzer-sys = "=0.4.10"
arrow-array = "=59.2.0"
arrow-schema = "=59.2.0"
arrow-select = "=59.2.0"
serde_json = "=1.0.151"
num-traits = "=0.2.19"
geo = "=0.33.1"
geozero = { version = "=0.15.1", default-features = false, features = ["with-geo", "with-wkb"] }

# ---------------------------------------------------------------------------
# Target portati da plenora-nogeo-tools/fuzz (adattati ai nuovi path:
# plenora_nogeo_tools -> plenora_engine::table_engine).
# ---------------------------------------------------------------------------

[[bin]]
name = "plan_contract"
path = "fuzz_targets/plan_contract.rs"
test = false
doc = false
bench = false

