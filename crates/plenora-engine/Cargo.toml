[package]
name = "plenora-engine"
description = "Contratto piano, planner (validate), preparer ed executor del DAG (architettura.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Propagazione coerente dei backend opzionali di plenora-kernels-geo
# (make_valid richiede geos, reproject richiede proj).
[features]
default = []
# Espone i moduli interni ai due consumatori che stanno **fuori** dal crate e
# non possono raggiungerli altrimenti: il crate `fuzz/` e la sonda di
# calibrazione. Non e' nel `default` e nessun consumatore la abilita, quindi
# la superficie pubblica del crate non cambia.
internals = []
geos-backend = ["plenora-kernels-geo/geos-backend"]
proj-backend = ["plenora-kernels-geo/proj-backend"]
full-backends = ["geos-backend", "proj-backend"]

# Il percorso di qualificazione end-to-end: un processo suo, e non un caso.
#
# Non puo' essere un `#[test]`, e la ragione e' strutturale: libtest esegue ogni
# caso in un thread proprio, mentre l'harness fa esattamente cio' che fa il
# supervisore — toglie `CLOEXEC` a due descrittori e subito dopo avvia un
# processo. Quella finestra e' sicura solo in un processo con un thread solo, e
# `accerta_monothread` lo pretende. Un binario ce l'ha; un binario di test no.
#
# `required-features` lo lega a `internals`: senza, non viene nemmeno compilato.
[[bin]]
name = "plenora-qualifica-worker"
path = "src/bin/qualifica_worker.rs"
required-features = ["internals"]

[dependencies]
plenora-core.workspace = true
plenora-kernels-table.workspace = true
plenora-kernels-geo.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rayon.workspace = true
sha2.workspace = true
tempfile.workspace = true
# execution_id delle esecuzioni (errori-e-limiti.md, errori arricchiti): UUID v4 — versione gia'
# pinnata nel workspace (usata da plenora-kernels-table), nessuna dep nuova.
uuid.workspace = true
# Usati dalla validazione delle config portata da nogeo (regex, timezone).
regex.workspace = true
chrono-tz.workspace = true
# Usati direttamente dal trasporto geo portato (celle WKB, geometrie).
geo.workspace = true
geozero.workspace = true

# statfs per il riconoscimento fail-closed del filesystem di publish
# (errori-e-limiti.md#publish-e-cleanup, geo_transport::publish); solo Linux.
[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

# La sonda importa `MAX_PIANO_CANONICO_BYTES` dal protocollo invece di
# tenerne una copia: due copie dello stesso numero sono due numeri che
# possono divergere.
[[example]]
name = "calibra_canonico"
required-features = ["internals"]

# L'immagine del gate ostile su Linux. E' un esempio e non un `bin` perche' non
# deve finire in nessuna installazione: `cargo install` non li produce. Serve
# **anche** `--cfg qualificazione_isolamento`, senza il quale il `main` di
# ripiego rifiuta di girare invece di girare a meta'.
[[example]]
name = "qualificazione_isolamento"
required-features = ["internals"]

[dev-dependencies]
proptest.workspace = true
# Usato dalle property suite portate (extended_properties.rs).
num-traits.workspace = true

[lints]
workspace = true
