[package]
name = "plenora-pipeline"
description = "Runner minimo di pipeline: piano SSA di kernel tabellari e geografici su RecordBatch interi in memoria"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
plenora-core.workspace = true
plenora-kernels-table.workspace = true
# Operazioni geo del runner: analisi dei contratti, kernel e adapter
# Arrow dei kernel geografici. Crate del workspace, nessun pacchetto nuovo.
plenora-kernels-geo.workspace = true
# Il tipo `geo::Geometry` che i kernel geografici ricevono e rendono: la
# stessa copia (vendorizzata) che plenora-kernels-geo usa gia', nessun
# pacchetto nuovo nel lockfile.
geo.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Proptest delle catene del budget (tests/budget.rs).
proptest.workspace = true
# SHA-256 del catalogo delle misure contro quello registrato nel modello.
sha2.workspace = true

[features]
# Sonde delle prove dei controlli (plenora_pipeline::sonda): solo nelle build
# delle prove, mai in quelle di rilascio. Disattivata per default.
sonde-di-prova = []

[lints]
workspace = true
