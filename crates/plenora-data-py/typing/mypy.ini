[mypy]
strict = True
# Il pacchetto si controlla dai sorgenti (MYPYPATH=crates/plenora-data-py/python),
# con la stessa severita' del consumatore: nessuna sezione ignora errori in
# plenora_data.
warn_unreachable = True

# pyarrow 25 non pubblica tipi (niente py.typed, niente stub): i suoi oggetti
# sono `Any` per mypy, qui e nel codice di chi usa l'SDK.
[mypy-pyarrow]
ignore_missing_imports = True

[mypy-pyarrow.*]
ignore_missing_imports = True
