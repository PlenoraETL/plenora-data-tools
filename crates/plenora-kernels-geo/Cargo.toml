[package]
name = "plenora-kernels-geo"
description = "Kernel geografici su geo::Geometry e adapter Arrow GeoArrow-WKB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
plenora-core.workspace = true
# La lettura delle chiavi di `geo.collect` come testo: l'analisi rifiuta i
# tipi che `scalar_as_string` non converte con la stessa funzione dei kernel
# tabellari (`validate_text_convertible`), invece di una seconda copia della
# regola. Crate del workspace (dipende solo da plenora-core), nessun
# pacchetto nuovo.
plenora-kernels-table.workspace = true
geo.workspace = true
# Ellissoide del datum nelle misure geodetiche (motivazione nel manifesto
# del workspace).
geographiclib-rs.workspace = true
geozero.workspace = true
wkt.workspace = true
rayon.workspace = true
rstar.workspace = true
spade.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Coordinate razionali esatte dell'arrangiamento DE-9IM, anche per tutti
# gli esponenti f64 finiti; riusa la versione gia' presente nel lock.
num-bigint = "=0.5.1"

[dev-dependencies]
proptest.workspace = true
log.workspace = true
# Allocatore globale solo nel binario heap_reale: callback sicure per byte
# vivi/picco atomici, senza introdurre unsafe nel workspace.
tracking-allocator = { version = "=0.4.0", default-features = false }
# Censimento O-M3 dei cicli sul vero AST Rust, inclusi i corpi degli iteratori;
# evita una scansione regex che confonda macro, commenti e blocchi annidati.
# Versione esatta allineata alla famiglia (database-tools).
syn = { version = "=3.0.6", features = ["full", "visit"] }
# Posizioni dei nodi AST per collegare ogni ciclo al sorgente verificato.
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }

[lints]
workspace = true
