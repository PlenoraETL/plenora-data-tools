[package]
name = "plenora-io"
description = "Ingresso e uscita su file: Arrow IPC (file e stream), Parquet e GeoParquet 1.1, scrittura atomica, esecuzione di un piano da file a file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
plenora-core.workspace = true
plenora-pipeline.workspace = true
# `Buffer` per la lettura IPC dagli stessi byte verificati (motivazione al
# pin nel Cargo.toml del workspace).
arrow-buffer.workspace = true
parquet.workspace = true
# Solo per fissare la versione del CRC32 che `parquet` usa per i checksum di
# pagina (feature `crc`, motivazione al pin nel Cargo.toml del workspace).
crc32fast.workspace = true
base64.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[dev-dependencies]
# Oracolo del riquadro e dei tipi letti dal WKB: codifica di riferimento
# (`encode_geometry`) e `geo::BoundingRect` (tests/wkb_oracolo.rs).
plenora-kernels-geo.workspace = true
geo.workspace = true
proptest.workspace = true
# Il riferimento delle operazioni (tests/operazioni_doc.rs): tipi delle
# config di `table.pivot` (senza `mapping`) e `table.transpose`, che il
# runner rifiuta e l'esempio chiama dal kernel; date e istanti delle tabelle d'esempio; WKT
# delle geometrie d'esempio. Tutti gia' nel workspace, nessun crate nuovo nel
# lockfile.
plenora-kernels-table.workspace = true
chrono.workspace = true
wkt.workspace = true
serde.workspace = true
# SHA-256 dei vettori di conformita' del contratto Arrow copiati da
# plenora-contracts (tests/contratti_arrow.rs): gia' nel workspace per
# `table.sha256_hash`, nessun crate nuovo nel lockfile.
sha2.workspace = true

# I test dell'esempio (lettura della catena, percorsi d'uscita) girano con
# `cargo test`.
[[example]]
name = "catena_da_file"
test = true

[features]
# Sonde delle prove dei controlli (plenora_pipeline::sonda): solo nelle build
# delle prove, mai in quelle di rilascio. Disattivata per default.
sonde-di-prova = ["plenora-pipeline/sonde-di-prova"]

# La prova dei punti di sonda esiste solo con la feature: la CI la fa
# girare a parte (`cargo test -p plenora-io --features sonde-di-prova`).
[[test]]
name = "sonda_dei_controlli"
required-features = ["sonde-di-prova"]

[lints]
workspace = true
